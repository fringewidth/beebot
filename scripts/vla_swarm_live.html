<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>swarm/live</title>
<meta name="color-scheme" content="dark">
<style>
  :root {
    --bg: #0c0c0c;
    --panel: #111111;
    --line: #262626;
    --dim: #5c5c5c;
    --mid: #8a8a8a;
    --fg: #d4d4d4;
    --hi: #f2f2f2;
    --ok: #9fd39a;
    --warn: #e0b46a;
    --bad: #e08a7e;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.5 var(--mono); }
  ::selection { background: #333; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 460px; gap: 0; height: 100svh; }
  @media (max-width: 960px) { main { grid-template-columns: 1fr; height: auto; } }
  .left { display: flex; flex-direction: column; border-right: 1px solid var(--line); min-height: 0; }
  .bar { display: flex; gap: 18px; padding: 6px 12px; border-bottom: 1px solid var(--line); color: var(--mid); white-space: nowrap; overflow-x: auto; }
  .bar b { color: var(--fg); font-weight: 500; }
  .stagewrap { flex: 1; display: grid; place-items: center; padding: 12px; min-height: 0; }
  canvas { display: block; width: min(100%, calc(100svh - 80px)); aspect-ratio: 1; image-rendering: pixelated; border: 1px solid var(--line); }
  .keys { padding: 6px 12px; border-top: 1px solid var(--line); color: var(--dim); white-space: nowrap; overflow-x: auto; }
  .keys kbd { font: inherit; color: var(--mid); border: 1px solid var(--line); padding: 0 4px; margin-right: 3px; }
  .right { display: flex; flex-direction: column; min-height: 0; background: var(--panel); }
  .sec { padding: 10px 12px; border-bottom: 1px solid var(--line); }
  .lbl { color: var(--dim); }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  button, input { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 0; padding: 2px 8px; }
  button { cursor: pointer; }
  button:hover { border-color: var(--mid); color: var(--hi); }
  button[aria-pressed=true] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  input:focus { outline: none; border-color: var(--mid); }
  .prompt { display: flex; align-items: center; gap: 6px; background: var(--bg); border: 1px solid var(--line); padding: 6px 8px; }
  .prompt:focus-within { border-color: var(--mid); }
  .prompt span { color: var(--ok); }
  .prompt input { flex: 1; border: 0; padding: 0; background: none; color: var(--hi); }
  .chips { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 4px 10px; }
  .chip { border: 0; background: none; padding: 0; color: var(--mid); text-decoration: underline dotted var(--dim); text-underline-offset: 3px; }
  .chip:hover { color: var(--hi); }
  .num { width: 56px; }
  .sw { width: 18px; height: 18px; padding: 0; border: 1px solid #000; }
  .sw:hover { outline: 1px solid var(--hi); }
  .log { flex: 1; overflow-y: auto; padding: 10px 12px; min-height: 160px; }
  .entry { margin-bottom: 10px; }
  .entry .cmd { color: var(--hi); }
  .entry .cmd::before { content: "> "; color: var(--ok); }
  .entry .meta { color: var(--dim); }
  .entry ul { list-style: none; margin: 2px 0 0; padding: 0 0 0 14px; }
  .entry li { color: var(--fg); }
  .entry li::before { content: "+ "; color: var(--ok); }
  .entry .none { color: var(--dim); }
  .entry.old { opacity: 0.55; }
  .err { color: var(--bad); }
  .foot { padding: 8px 12px; color: var(--dim); border-top: 1px solid var(--line); }
</style>
</head>
<body>
<main>
  <div class="left">
    <div class="bar">
      <span>swarm/live</span>
      <span>model <b id="bModel">-</b></span>
      <span>g <b id="bG">-</b></span>
      <span>scene <b id="bScene">-</b></span>
      <span>t <b id="bT">0</b></span>
      <span><b id="bRate">0.0</b> step/s</span>
      <span id="bState">idle</span>
    </div>
    <div class="stagewrap"><canvas id="stage" aria-label="the swarm, live"></canvas></div>
    <div class="keys">
      <kbd>/</kbd>prompt <kbd>space</kbd>pause <kbd>m</kbd>model <kbd>1-4</kbd>drop r/g/b/y <kbd>[</kbd><kbd>]</kbd>scene <kbd>s</kbd>random scene <kbd>-</kbd><kbd>=</kbd>speed
    </div>
  </div>
  <div class="right">
    <div class="sec">
      <div class="prompt"><span>&gt;</span><input id="text" autocomplete="off" spellcheck="false" placeholder="eat the blue cheese" aria-label="instruction"></div>
      <div class="chips" id="chips"></div>
    </div>
    <div class="sec row">
      <span class="lbl">model</span><span id="models" class="row" style="gap:4px"></span>
      <span class="lbl" style="margin-left:8px">g</span><input class="num" id="guidance" type="number" min="1" step="0.5" value="2" aria-label="guidance">
    </div>
    <div class="sec row">
      <button id="play" aria-label="pause">pause</button>
      <span class="lbl">speed</span><input id="speed" type="range" min="2" max="24" value="10" aria-label="speed" style="flex:1;accent-color:#8a8a8a">
      <span id="fps" style="width:56px;text-align:right">10/s</span>
    </div>
    <div class="sec row">
      <span class="lbl">drop</span><span id="drops" class="row" style="gap:6px"></span>
      <span class="lbl" style="margin-left:8px">scene</span>
      <button id="prev" aria-label="previous scene">[</button><input class="num" id="sceneN" type="number" min="0" value="0" aria-label="scene"><button id="next" aria-label="next scene">]</button><button id="rand">rand</button>
    </div>
    <div class="log" id="log"></div>
    <div class="foot">policy sees the current frame + your words. no memory. end states settle, changes keep going. <span class="err" id="err"></span></div>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
const TINT = { red: [196, 96, 84], green: [116, 170, 108], blue: [98, 138, 196], yellow: [214, 180, 92] };

let S = null, current = null, history = [], buffer = [], playing = true, inflight = false, models = [], model = null, text = "";
let groundCache = null, stepsShown = [], entry = null;
const stage = $("stage");

function sizeCanvas() {
  const w = Math.max(64, Math.round(stage.clientWidth * Math.min(2, devicePixelRatio || 1)));
  const px = S ? Math.floor(w / S.grid) * S.grid : w;
  if (stage.width !== px) { stage.width = px; stage.height = px; groundCache = null; }
  return px;
}
function ground(px) {
  const grid = S.grid, c = document.createElement("canvas"); c.width = c.height = px;
  const g = c.getContext("2d"), cell = px / grid;
  g.fillStyle = "#101010"; g.fillRect(0, 0, px, px);
  g.fillStyle = "#161616";
  for (let r = 0; r < grid; r++) for (let q = 0; q < grid; q++) if ((r + q) % 2) g.fillRect(q * cell, r * cell, cell, cell);
  for (const [r, col, h, w, k] of S.boxes) {
    const [tr, tg, tb] = TINT[k];
    g.fillStyle = `rgba(${tr},${tg},${tb},0.10)`; g.fillRect(col * cell, r * cell, w * cell, h * cell);
    g.strokeStyle = `rgba(${tr},${tg},${tb},0.75)`; g.lineWidth = Math.max(1, Math.round(cell / 8));
    g.setLineDash([cell / 2, cell / 2]); g.strokeRect(col * cell + 0.5, r * cell + 0.5, w * cell - 1, h * cell - 1); g.setLineDash([]);
  }
  g.fillStyle = "#3a3a3a";
  for (const i of S.walls) g.fillRect((i % grid) * cell, Math.floor(i / grid) * cell, cell, cell);
  return c;
}
function draw() {
  if (!S || !current) return;
  const px = sizeCanvas(), cell = px / S.grid, g = stage.getContext("2d");
  if (!groundCache) groundCache = ground(px);
  g.drawImage(groundCache, 0, 0);
  for (const [r, col, alive, k] of current.cheeses) {
    const [tr, tg, tb] = TINT[k], s = S.side * cell, x = col * cell, y = r * cell;
    if (!alive) { g.strokeStyle = `rgba(${tr},${tg},${tb},0.35)`; g.lineWidth = 1; g.strokeRect(x + 0.5, y + 0.5, s - 1, s - 1); continue; }
    g.fillStyle = `rgb(${tr},${tg},${tb})`; g.fillRect(x, y, s, s);
    g.fillStyle = "rgba(0,0,0,0.25)"; g.fillRect(x, y + s - Math.max(1, cell / 4), s, Math.max(1, cell / 4));
  }
  for (let k = history.length - 1; k >= 0; k--) {
    const age = history.length - 1 - k; if (age > 3) break;
    g.fillStyle = age === 0 ? "#e8e8e8" : `rgba(200,200,200,${0.10 - age * 0.025})`;
    const pad = age === 0 ? Math.max(1, Math.round(cell * 0.12)) : 0;
    for (const i of history[k]) g.fillRect((i % S.grid) * cell + pad, Math.floor(i / S.grid) * cell + pad, cell - 2 * pad, cell - 2 * pad);
  }
  $("bT").textContent = String(current.t).padStart(5, "0");
}
function show(frame) { current = frame; history.push(frame.robots); if (history.length > 5) history.shift(); stepsShown.push(performance.now()); }

async function api(route, body = {}) {
  const r = await fetch(route, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const out = await r.json();
  $("err").textContent = out.error || "";
  if (out.error) throw new Error(out.error);
  return out;
}
function absorb(out, takeFrame) {
  const sceneChanged = !S || out.static.scene !== S.scene;
  S = out.static; models = out.models; model = out.model; text = out.text;
  if (sceneChanged) { groundCache = null; history = []; buffer = []; }
  if (takeFrame || !current) show(out.frame);
  setEvents(out.events);
  $("sceneN").value = S.scene; $("bScene").textContent = `${S.scene}/${S.scenes}`;
  $("bModel").textContent = model; $("bG").textContent = (+$("guidance").value).toFixed(1);
  renderModels(); renderChips(out.frame);
}
function logEntry(cmd) {
  if (entry) entry.classList.add("old");
  entry = document.createElement("div"); entry.className = "entry";
  const time = new Date().toTimeString().slice(0, 8);
  entry.innerHTML = `<div class="cmd"></div><div class="meta">${time} · ${model} · g=${(+$("guidance").value).toFixed(1)} · scene ${S.scene} · t=${current ? current.t : 0}</div><ul><li class="none">nothing yet</li></ul>`;
  entry.querySelector(".cmd").textContent = cmd;
  $("log").prepend(entry);
}
function setEvents(list) {
  if (!entry) return;
  entry.querySelector("ul").innerHTML = list.length ? list.map(e => `<li>${e}</li>`).join("") : '<li class="none">nothing yet</li>';
}
function renderModels() {
  $("models").innerHTML = models.map(m => `<button aria-pressed="${m.key === model}" data-k="${m.key}" title="${m.detail}">${m.key}</button>`).join("");
  document.querySelectorAll("#models button").forEach(b => b.onclick = () => switchModel(b.dataset.k));
}
async function switchModel(k) {
  const m = models.find(x => x.key === k); if (!m || k === model) return;
  model = k; $("guidance").value = m.guidance; renderModels();
  $("bModel").textContent = model; $("bG").textContent = m.guidance.toFixed(1);
  if (text) await steer(text);
}
function renderChips(frame) {
  const alive = [...new Set(frame.cheeses.filter(c => c[2]).map(c => c[3]))];
  const ideas = [...alive.map(k => `eat the ${k} cheese`), ...(alive[0] ? [`surround the ${alive[0]} cheese`] : []),
    ...S.boxes.slice(0, 1).map(b => `go into the ${b[4]} box`), "split into two groups", "gather in the center", "move up and left"];
  $("chips").innerHTML = ideas.map(t => `<button class="chip">${t}</button>`).join("");
  document.querySelectorAll(".chip").forEach(c => c.onclick = () => { $("text").value = c.textContent; steer(c.textContent); });
}
const COLOURS = ["red", "green", "blue", "yellow"];
async function drop(k) {
  const out = await api("/api/cheese", { colour: k });
  if (!out.added) $("err").textContent = `no room for a ${k} cheese`;
  buffer = []; absorb(out, true); draw();
}
function renderDrops() {
  $("drops").innerHTML = COLOURS.map((k, i) => `<button class="sw" title="${i + 1}: drop a ${k} cheese" aria-label="drop a ${k} cheese" data-k="${k}" style="background:rgb(${TINT[k].join(",")})"></button>`).join("");
  document.querySelectorAll(".sw").forEach(d => d.onclick = () => drop(d.dataset.k));
}
async function steer(t) {
  t = t.trim(); if (!t) return;
  const out = await api("/api/instruct", { text: t, model, guidance: +$("guidance").value });
  logEntry(t); absorb(out, false);
  $("bState").textContent = playing ? "running" : "paused";
}
async function pump() {
  if (!playing || inflight || buffer.length > 6 || !S || !text) return;
  inflight = true;
  try { const out = await api("/api/step", { n: 4 }); buffer.push(...out.frames); setEvents(out.events); } catch (e) {} finally { inflight = false; }
}
let last = 0;
function loop(ts) {
  const fps = +$("speed").value;
  if (ts - last > 1000 / fps) { last = ts; if (playing && buffer.length) show(buffer.shift()); draw(); }
  const now = performance.now(); stepsShown = stepsShown.filter(x => now - x < 2000);
  $("bRate").textContent = (stepsShown.length / 2).toFixed(1);
  pump(); requestAnimationFrame(loop);
}
function togglePlay() {
  playing = !playing; $("play").textContent = playing ? "pause" : "play";
  $("bState").textContent = !text ? "idle" : playing ? "running" : "paused";
}
const goScene = async i => { buffer = []; const out = await api("/api/reset", { scene: i }); current = null; absorb(out, true); if (text) logEntry(text); draw(); };
$("play").onclick = togglePlay;
$("speed").oninput = () => $("fps").textContent = `${$("speed").value}/s`;
$("guidance").onchange = () => { $("bG").textContent = (+$("guidance").value).toFixed(1); if (text) steer(text); };
$("text").onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); steer($("text").value); } if (e.key === "Escape") $("text").blur(); };
$("prev").onclick = () => goScene(+$("sceneN").value - 1);
$("next").onclick = () => goScene(+$("sceneN").value + 1);
$("rand").onclick = () => goScene(Math.floor(Math.random() * (S ? S.scenes : 512)));
$("sceneN").onchange = () => goScene(+$("sceneN").value);
addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  if (e.key === "/") { e.preventDefault(); $("text").focus(); }
  else if (e.key === " ") { e.preventDefault(); togglePlay(); }
  else if (e.key === "m") switchModel(models[(models.findIndex(m => m.key === model) + 1) % models.length].key);
  else if ("1234".includes(e.key)) drop(COLOURS[+e.key - 1]);
  else if (e.key === "[") goScene(S.scene - 1);
  else if (e.key === "]") goScene(S.scene + 1);
  else if (e.key === "s") $("rand").click();
  else if (e.key === "-" || e.key === "=") { $("speed").value = +$("speed").value + (e.key === "=" ? 2 : -2); $("speed").oninput(); }
});
addEventListener("resize", () => { groundCache = null; draw(); });
(async () => {
  renderDrops();
  const out = await api("/api/state"); absorb(out, true);
  $("guidance").value = (models.find(m => m.key === model) || {}).guidance || 2; $("bG").textContent = (+$("guidance").value).toFixed(1);
  draw(); requestAnimationFrame(loop); $("text").focus();
})();
</script>
</body>
</html>
