; Cube50 firmware. One image for every cube; the cube id comes from the chip's MAC.
; Build:   pio run -e cube        Upload over USB-C:  pio run -e cube -t upload
; Gateway: pio run -e gateway     (an ESP32-S3 dev board on the host's USB that bridges serial and ESP-NOW)
; Compiles (2026-11-17, `uvx platformio run -e cube` and `-e gateway`, platformio 6.9.0 platform, CPU only); never run on hardware.
; Written 2026-11-17; hinge deploy drive 11:24 +0530 (src/deploy.cpp); 60 mm redesign: quadrature disc encoders, quarter-turn lock (src/disc.cpp), 8 SMA channels.

[env]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 921600
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -Wall

[env:cube]
build_src_filter = +<*>

[env:gateway]
build_flags = ${env.build_flags} -DGATEWAY=1
build_src_filter = +<*>
