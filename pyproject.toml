[project]
name = "beebot"
version = "0.1.0"
description = "Language-steered robot swarms: v0 neural cellular automata, v1 a 2D LM swarm policy, v2 the 3D voxel world, hardware the cube modules"
readme = "README.md"
authors = [
    { name = "Hrishik Sai Bojnal", email = "116365046+fringewidth@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.1.0",
    "mujoco>=4.0.0",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "torch>=2.14.1",
    "transformers>=5.22.1",
]

[project.scripts]
train = "beebot.train:main"
bench = "beebot.bench:main"
train-feast = "beebot.train_feast:main"
train-rivals = "beebot.train_rivals:main"
rivals-probes = "beebot.rivals_probes:main"
final-test = "beebot.final_test:main"
report = "beebot.report:main"
probe = "beebot.probe:main"
score = "beebot.score:main"
play-run = "beebot.vla.play_cli:main"
vla-teleop = "beebot.vla.teleop:main"
train-vla = "beebot.vla.train:main"
play-stats = "beebot.vla.play_stats:main"
vla-caption = "beebot.vla.caption:main"
vla-caption-set = "beebot.vla.caption_set:main"
play-coverage = "beebot.vla.play_coverage:main"
vla-preflight = "beebot.vla.preflight:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# beebot is a namespace package split over four source dirs (no beebot/__init__.py, no beebot/vla/__init__.py).
# Import names did not change in the 2026-11-17 split: beebot.vla.* lives in v1, beebot.vla.voxel.* in v2,
# beebot.hardware.* in hardware, and the neural-CA modules (beebot.train, beebot.ca, ...) in v0.
[tool.hatch.build]
dev-mode-dirs = ["v0/src", "v1/src", "v2/src", "hardware/src"]

[tool.hatch.build.targets.wheel]
only-include = ["v0/src/beebot", "v1/src/beebot", "v2/src/beebot", "hardware/src/beebot"]
sources = ["v0/src", "v1/src", "v2/src", "hardware/src"]

[tool.pytest.ini_options]
testpaths = ["v0/tests", "v1/tests", "v2/tests", "hardware/tests"]

[dependency-groups]
cad = [
    "cadquery>=2.8.0",
    "trimesh>=5.2.1",
]
dev = [
    "pytest>=9.1.1",
]
hardware = [
    "cma>=4.5.0",
    "magpylib>=6.3.0",
    "ngsolve>=6.2.2608",
    "numba>=0.68.1",
    "pymoo>=0.6.2",
]

[tool.uv]
default-groups = "all"  # a plain `uv sync` keeps the hardware and CAD packages
