[project]
name = "beebot"
version = "0.1.0"
description = "Neural cellular automata that learn to surround cheese with conserved mass"
readme = "README.md"
authors = [
    { name = "Hrishik Sai Bojnal", email = "116365046+fringewidth@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.1.0",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "torch>=2.14.1",
    "transformers>=5.22.1",
]

[project.scripts]
train = "beebot.train:main"
bench = "beebot.bench:main"
train-feast = "beebot.train_feast:main"
train-rivals = "beebot.train_rivals:main"
rivals-probes = "beebot.rivals_probes:main"
final-test = "beebot.final_test:main"
report = "beebot.report:main"
probe = "beebot.probe:main"
score = "beebot.score:main"
play-run = "beebot.vla.play_cli:main"
vla-teleop = "beebot.vla.teleop:main"
train-vla = "beebot.vla.train:main"
play-stats = "beebot.vla.play_stats:main"
vla-caption = "beebot.vla.caption:main"
vla-caption-set = "beebot.vla.caption_set:main"
play-coverage = "beebot.vla.play_coverage:main"
vla-preflight = "beebot.vla.preflight:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
